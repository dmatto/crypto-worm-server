name = "crypto-worm-server"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Domain shown in the Solana sign-in message, and the pages allowed to call the API.
SIGNIN_DOMAIN = "rainbow-kitten-2ecc2a.netlify.app"
ALLOWED_ORIGINS = "https://rainbow-kitten-2ecc2a.netlify.app"
# The Mini App link, for the challenge messages the bot sends to friends who are offline.
GAME_LINK = "https://t.me/CryptoWormWarsBot/play"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   BOT_TOKEN       the Telegram bot token from BotFather
#   SESSION_SECRET  any long random string

[[d1_databases]]
binding = "DB"
database_name = "crypto-worm"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[durable_objects]
bindings = [
  { name = "MATCH", class_name = "Match" },
  { name = "LOBBY", class_name = "Lobby" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match", "Lobby"]
